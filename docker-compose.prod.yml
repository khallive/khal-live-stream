version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khal-live-stream-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - APP_NAME=${APP_NAME:-khal live stream}
      - STREAM_CHANNEL=${STREAM_CHANNEL:-khal}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - RTMP_URL=${RTMP_URL:-rtmp://localhost:1935/live}
      - HLS_URL=${HLS_URL:-http://localhost:8080/hls/khal.m3u8}
    ports:
      - "3000:3000"
    depends_on:
      - stream

  stream:
    image: alfg/nginx-rtmp:latest
    container_name: khal-live-stream-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./streaming/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./streaming/hls:/tmp/hls
